name: Main

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  mac-test:
    name: Mac Test
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - platform: macOS
            scheme: "SWXMLHash OSX"
            action: "build-for-testing test-without-building"

          - platform: iOS
            scheme: "SWXMLHash iOS"
            action: "build-for-testing test-without-building"
            sdk-and-dest: "-sdk iphonesimulator -destination \"name=iPhone 16,OS=latest\""

          - platform: tvOS
            scheme: "SWXMLHash tvOS"
            sdk-and-dest: "-sdk appletvsimulator -destination \"name=Apple TV\""

          - platform: watchOS
            scheme: "SWXMLHash watchOS"
            action: "build-for-testing test-without-building"
            sdk-and-dest: "-sdk watchsimulator"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        # using @v1
        with:
          xcode-version: latest-stable

      - name: Build and Test
        env:
          WORKSPACE: "-workspace SWXMLHash.xcworkspace"
        run: |
          xcodebuild ${{ matrix.action }} $WORKSPACE -scheme ${{ matrix.scheme }} ${{ matrix.sdk-and-dest }} | xcpretty
      # TODO: I'd like to use this action instead of the above xcodebuild command, but I'm getting a destination error:
      # xcodebuild: error: Unable to find a destination matching the provided destination specifier:
      #   		{ id:D918798E-6DEE-48F7-850A-A4C0D9328F0A }
      #
      # - uses: mxcl/xcodebuild@v3.0.0
      #   with:
      #     platform: ${{ matrix.platform }}
      #     workspace: "SWXMLHash.xcworkspace"

  linux-test:
    name: Linux Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: swift:5.10-focal
            skip-testing: true

          - image: swift:5.10-jammy
            skip-testing: true

          - image: swift:5.10-rhel-ubi9
            skip-testing: true

          - image: swift:6.0-focal
            perform-testing: true

          - image: swift:6.0-jammy
            perform-testing: true

          - image: swift:6.0-rhel-ubi9
            perform-testing: true

          - image: swift:6.4-jammy
            perform-testing: true

          - image: swift:6.4-noble
            perform-testing: true

          - image: swift:6.4-rhel-ubi9
            perform-testing: true
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build
        if: ${{ matrix.skip-testing }}
        run: |
          swift build
      - name: Build and test
        if: ${{ matrix.perform-testing }}
        run: |
          swift build --build-tests
          swift test

  windows-test:
    name: Windows Test
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: swift-6.4-release
            tag: 6.4-RELEASE
            perform-testing: true

    steps:
      - name: Install Swift
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5
        # using @main
        with:
          branch: ${{ matrix.branch}}
          tag: ${{ matrix.tag }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build
        if: ${{ matrix.skip-testing }}
        run: |
          swift build
      - name: Build and test
        if: ${{ matrix.perform-testing }}
        run: |
          swift build --build-tests
          swift test
